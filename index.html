<html>
<head>
<title>scrolling text</title>
<style>
body {
font-family-arial,sans-serif;
}
.scroll-box {
width:100%;
overflow:hidden;
background-color:navy;
color:yellow;
padding:15px 0;
}
.scroll-text {
white-space:nowrap;
display:inline-block;
padding-left:100%;
animation:scroll 10s linear infinite;
font-size:25px;
font-weight:bold;
}
@keyframes scroll {
from {
transform:translatex(-100%);
}
to {
transform:translatex(0);
}
}
</style>
</head>
<body>
<div class="scroll-box">
<div class="scroll-text">
welcome to government degree college porumamilla
</div>
</div>
</body>
</html>
